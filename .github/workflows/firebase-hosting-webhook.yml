name: Deploy to Firebase Hosting on content webhook
'on':
  repository_dispatch:
    types: [TRIGGER_DEPLOYMENT]
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # 백오피스 배포 버튼(repository_dispatch)은 운영(live) 발행용 → 기본 브랜치(develop)가
      # 아니라 항상 master를 빌드한다. 주의: repository_dispatch는 워크플로 정의를 기본
      # 브랜치에서 읽으므로, 이 pnpm 빌드는 master도 Next로 승급된 뒤에만 성공한다
      # (master가 아직 Gatsby면 빌드 실패 = 운영에 잘못 배포되는 것보다 안전한 실패).
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Cache Next.js build + optimized images
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            public/nextImageExportOptimizer
            public/images/next-image-export-optimizer-hashes.json
            remoteImagesForOptimization
          key: ${{ runner.os }}-namsan-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-namsan-build-
      - name: Check Github action trigger
        run:  |
          echo "Event '${{ github.event.action }}' received from '${{ github.event.client_payload.repository }}'"
      - name: Generate Environment Variables File for Production
        run: |
          echo "NEXT_PUBLIC_FIREBASE_API_KEY=$GATSBY_FIREBASE_API_KEY" >> .env
          echo "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$GATSBY_FIREBASE_AUTH_DOMAIN" >> .env
          echo "NEXT_PUBLIC_FIREBASE_PROJECT_ID=$GATSBY_FIREBASE_PROJECT_ID" >> .env
          echo "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=$GATSBY_FIREBASE_STORAGE_BUCKET" >> .env
          echo "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$GATSBY_FIREBASE_MESSAGING_SENDER_ID" >> .env
          echo "NEXT_PUBLIC_FIREBASE_APP_ID=$GATSBY_FIREBASE_APP_ID" >> .env
          echo "NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=$GATSBY_FIREBASE_MEASUREMENT_ID" >> .env
        env:
          GATSBY_FIREBASE_API_KEY: ${{ secrets.GATSBY_FIREBASE_API_KEY }}
          GATSBY_FIREBASE_AUTH_DOMAIN: ${{ secrets.GATSBY_FIREBASE_AUTH_DOMAIN }}
          GATSBY_FIREBASE_PROJECT_ID: ${{ secrets.GATSBY_FIREBASE_PROJECT_ID }}
          GATSBY_FIREBASE_STORAGE_BUCKET: ${{ secrets.GATSBY_FIREBASE_STORAGE_BUCKET }}
          GATSBY_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.GATSBY_FIREBASE_MESSAGING_SENDER_ID }}
          GATSBY_FIREBASE_APP_ID: ${{ secrets.GATSBY_FIREBASE_APP_ID }}
          GATSBY_FIREBASE_MEASUREMENT_ID: ${{ secrets.GATSBY_FIREBASE_MEASUREMENT_ID }}
      # 배포 버튼(repository_dispatch)은 ref:master를 빌드 — github.sha(=default branch)가
      # 아니라 git HEAD(실제 체크아웃된 master 커밋)를 찍어야 정확. UI 비노출 /build-info.json.
      - name: Stamp build-info
        run: |
          mkdir -p public
          printf '{"branch":"%s","commit":"%s","channel":"%s","event":"%s","runId":"%s","builtAt":"%s"}\n' \
            "master" "$(git rev-parse HEAD)" "live" "${{ github.event_name }}" "${{ github.run_id }}" "$(date -u +%FT%TZ)" \
            > public/build-info.json
          cat public/build-info.json
      - run: pnpm install --frozen-lockfile && pnpm build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_NAMSAN_801DE }}'
          channelId: live
          projectId: namsan-801de
